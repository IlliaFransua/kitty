
# ==========================================
# Font settings
# ==========================================
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
font_size	 12.0
modify_font cell_height 120%

# ==========================================
# Cursor
# ==========================================
cursor           #50A14F
cursor_text_color background
cursor_shape     block
cursor_shape_unfocused hollow

cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 0
shell_integration no-cursor

# ==========================================
# Appearance & Window
# ==========================================
scrollback_lines 2000
scrollbar scrolled-or-hovered
scrollbar_track_hover_opacity 0.05

pixel_scroll yes
touch_scroll_multiplier 1.5
momentum_scroll 1.0

# ==========================================
# URLs
# ==========================================

url_color #0087bd
url_style curly

underline_hyperlinks hover
detect_urls yes

# (not working)
# show_hyperlink_targets shift
# hyperlink_target_position tooltip

strip_trailing_spaces smart
paste_actions quote-urls-at-prompt,confirm
select_by_word_characters @-./_~?&=%+#

# ==========================================
# Performance & Bell
# ==========================================

repaint_delay 8
input_delay 2
sync_to_monitor yes

enable_audio_bell no

# ==========================================
# Window
# ==========================================

remember_window_size yes
hide_window_decorations yes
window_padding_width 0

confirm_os_window_close -1

# ==========================================
# Tabs
# ==========================================

tab_bar_style        custom
tab_bar_edge 	     top
tab_bar_align        center
tab_bar_margin_width 0.0
tab_bar_margin_height 8.0 0.0
tab_title_template ""

# ==========================================
# Colors
# ==========================================

background_opacity       0.6
background_blur          20

# ==========================================
# Advanched
# ==========================================

shell zsh
editor nvim

# ==========================================
# Clipboard
# ==========================================

map shift+ctrl+c send_text all \x03
map ctrl+c copy_or_noop
map ctrl+v paste_from_clipboard
map ctrl+t new_tab
map ctrl+w close_window

include colors/everforest/current.conf
